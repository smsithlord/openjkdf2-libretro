name: libretro core (Windows x64)

# The only workflow that builds THIS fork's deliverable. Upstream's three
# workflows (MinGW, Ubuntu, macOS) are kept for merge friendliness but run on
# workflow_dispatch only: they build the standalone game, not the core.

on:
  push:
    branches: [ master ]
    tags: [ 'libretro-v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Only the submodules the core needs (README_LIBRETRO.md lists the
          # same seven). GameNetworkingSockets/protobuf/physfs are not used.
          submodules: false

      - name: Submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 lib/SDL lib/SDL_mixer lib/openal lib/glew lib/zlib lib/libpng lib/freeglut
          git -C lib/SDL_mixer submodule update --init --depth 1

      # One interpreter for both pip and CMake. The runner's bare `pip` and
      # the Python3 CMake finds (hosted toolcache) are different installs, so
      # `pip install cogapp` landed where the globals.h generator never looked.
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python deps
        shell: pwsh
        run: |
          python -m pip install cogapp
          python -c "import cogapp; print(cogapp.__file__)"
          "PYTHON_EXE=$((Get-Command python).Source)" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build_libretro -A x64 -DPLAT_LIBRETRO=TRUE "-DPython3_EXECUTABLE=$env:PYTHON_EXE"

      - name: Build
        run: cmake --build build_libretro --config Release --target openjkdf2_libretro --parallel

      - name: Package
        shell: bash
        run: |
          set -e
          V=$(sed -n 's/.*set(OPENJKDF2_LIBRETRO_VERSION "\([^"]*\)").*/\1/p' cmake_modules/plat_libretro.cmake)
          PKG=openjkdf2_libretro-${V}-win64
          # Flat zips, like other independently released cores: the files sit
          # at the archive root, ready to drop into cores/ and info/.
          mkdir -p dist/$PKG dist/${PKG}-symbols
          cp build_libretro/Release/openjkdf2_libretro.dll  dist/$PKG/
          cp build_libretro/Release/openjkdf2_libretro.info dist/$PKG/
          cp build_libretro/Release/OpenAL32.dll            dist/$PKG/
          cp README_LIBRETRO.md                             dist/$PKG/README.md
          cp LICENSE.md                                     dist/$PKG/LICENSE.md
          cp THIRD_PARTY_NOTICES.md                         dist/$PKG/THIRD_PARTY_NOTICES.md
          cp build_libretro/Release/openjkdf2_libretro.pdb  dist/${PKG}-symbols/
          (cd dist/$PKG            && 7z a -tzip ../${PKG}.zip .)
          (cd dist/${PKG}-symbols  && 7z a -tzip ../${PKG}-symbols.zip .)
          echo "PKG=$PKG" >> $GITHUB_ENV

      - name: Runtime dependencies (OpenAL32.dll must be a delay-load import)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $out = & $dumpbin.FullName /dependents build_libretro\Release\openjkdf2_libretro.dll
          $out
          $text = $out -join "`n"
          $i = $text.IndexOf("delay load dependencies")
          if ($i -lt 0) { throw "no delay-load section: OpenAL32.dll is an eager import again" }
          if ($text.Substring(0, $i) -match "OpenAL32.dll") { throw "OpenAL32.dll is an eager import; it must be delay-loaded (see plat_libretro.cmake)" }
          if ($text.Substring($i) -notmatch "OpenAL32.dll") { throw "OpenAL32.dll is not in the delay-load section" }

      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}.zip

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}-symbols
          path: dist/${{ env.PKG }}-symbols.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/libretro-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/${{ env.PKG }}.zip
            dist/${{ env.PKG }}-symbols.zip
